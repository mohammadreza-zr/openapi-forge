# Publishes to npm when a push to main carries a version that is not on npm yet.
# A push that leaves `version` in package.json alone changes nothing here.
#
# No token is stored: npm trusted publishing lets this workflow publish by its
# own identity. Set it up once on npmjs.com — the package's Settings → Trusted
# Publisher → GitHub Actions: user `mohammadreza-zr`, repository
# `openapi-forge`, workflow filename `release.yml`.
name: release
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      unpublished: ${{ steps.check.outputs.unpublished }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          if out=$(npm view "$name@$version" version 2>&1); then
            echo "$name@$version is on npm already: nothing to publish."
            echo "unpublished=false" >> "$GITHUB_OUTPUT"
          elif grep -q E404 <<<"$out"; then
            echo "$name@$version is not on npm yet."
            echo "unpublished=true" >> "$GITHUB_OUTPUT"
          else
            echo "$out"
            exit 1
          fi

  ci:
    needs: version
    if: needs.version.outputs.unpublished == 'true'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [version, ci]
    if: needs.version.outputs.unpublished == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the identity npm trusts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run build
      # `prepublishOnly` would run the tests again; the `ci` job has just run them.
      - run: npm publish --provenance --ignore-scripts
